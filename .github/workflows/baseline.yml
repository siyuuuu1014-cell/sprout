name: L0-L1 baseline

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      # Official release tag SHAs verified with git ls-remote, 2026-10-16.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: '0.11.25'
          enable-cache: false
      - name: Locked clean install, L0 and offline L1
        run: python scripts/ci_baseline.py --output .workbuddy/ci-baseline
      - name: Publish logs and JUnit even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseline-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .workbuddy/ci-baseline/*.log
            .workbuddy/ci-baseline/*.xml
            .workbuddy/ci-baseline/*.json
